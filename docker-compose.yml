services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # SQLite — เก็บไฟล์ใน /app/data แล้ว mount volume เพื่อ persist
      DATABASE_URL: file:/app/data/stock-alert.db
      AUTH_SECRET: change-this-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MARKET_DATA_PROVIDER: mock
      POLLING_INTERVAL_SECONDS: "60"
      # worker รันใน container เดียวกับ app (SQLite แชร์ไฟล์ข้าม container ไม่ได้)
      RUN_WORKER_IN_WEB: "true"
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: mailto:admin@example.com
    ports:
      - "3000:3000"
    volumes:
      - appdata:/app/data

volumes:
  appdata:
