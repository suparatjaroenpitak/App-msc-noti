# Render Blueprint — deploy แบบ single service (SQLite ในตัว ไม่ต้องมี Postgres)
# ใช้: Render Dashboard → New → Blueprint → เลือก repo นี้
#
# สิ่งที่ Blueprint จะสร้าง:
#   1. stock-alert-web   (Docker web service — migrate + seed + Next.js + worker ใน container เดียว)
#
# ⚠️ ข้อควรรู้เรื่อง SQLite บน Render:
#   - ไฟล์ DB อยู่ที่ /app/data ใน filesystem ของ container ซึ่ง **ถูกรีเซ็ตทุกครั้งที่ deploy**
#     (แผน free ใช้ persistent disk แบบ mount ไม่ได้) — ข้อมูลผู้ใช้/alert จะหายตอน redeploy
#   - ถ้าต้องการเก็บข้อมูลถาวรจริง ๆ ให้อัปเกรดเป็น paid plan + เพิ่ม Render Disk mount ที่ /app/data
#   - ค่าที่ต้องกรอกตอน provision (sync = กรอกในหน้า dashboard):
#       - authSecret  : openssl rand -base64 32
#       - vapidPublicKey / vapidPrivateKey : npx web-push generate-vapid-keys

services:
  - type: web
    name: stock-alert-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    # start-with-worker: migrate (มี preflight/timeout กันแขวน) → seed (opt-in) → Next.js + worker
    dockerCommand: node scripts/start-with-worker.mjs
    envVars:
      # SQLite — ไฟล์เดียวใน container ไม่ต้องพึ่ง Postgres service อีกต่อไป
      - key: DATABASE_URL
        value: file:/app/data/stock-alert.db
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://stock-alert-web.onrender.com   # TODO: แก้เป็นโดเมนจริงหลัง deploy แรก
      - key: MARKET_DATA_PROVIDER
        value: mock          # TODO: เปลี่ยนเป็น provider จริงก่อนใช้งานจริง
      - key: POLLING_INTERVAL_SECONDS
        value: "60"
      # worker รันใน container เดียวกับ app (SQLite แชร์ไฟล์ข้าม container ไม่ได้)
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # ตั้ง true เฉพาะเมื่อ migration พังค้าง (P3009) — จะลบไฟล์ DB แล้ว migrate ใหม่
      # ⚠️ ข้อมูลใน DB จะหายหมด — ใช้เฉพาะตอนยังไม่มีข้อมูลจริง — ปิดหลัง deploy สำเร็จ
      - key: DB_AUTO_RECOVER
        sync: false
      # ตั้ง true เพื่อ seed ข้อมูลเริ่มต้น (demo user + assets) — ปิดหลัง deploy สำเร็จ
      - key: FRESH_DB_SEED
        sync: false
